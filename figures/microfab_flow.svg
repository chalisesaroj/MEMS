<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 580" width="1600" height="580" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arw" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1f4e79"/></marker><marker id="arwW" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c46a12"/></marker><marker id="arwG" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5c6b7a"/></marker></defs><rect x="0" y="0" width="1600" height="580" fill="#ffffff"/><rect x="30" y="210" width="210" height="150" rx="12" fill="#eef4fb" fill-opacity="1.0" stroke="#1f4e79" stroke-width="3"/><text x="135.0" y="259.0" font-size="25" fill="#10243a" text-anchor="middle" font-weight="normal" font-style="normal" dominant-baseline="middle">Substrate</text><text x="135.0" y="288.5" font-size="18" fill="#40546b" text-anchor="middle" font-weight="normal" font-style="normal" dominant-baseline="middle">Silicon wafer,</text><text x="135.0" y="314.5" font-size="18" fill="#40546b" text-anchor="middle" font-weight="normal" font-style="normal" dominant-baseline="middle">cleaned</text><circle cx="135.0" cy="158" r="26" fill="#1f4e79" stroke="#1f4e79" stroke-width="3"/><text x="135.0" y="158" font-size="24" fill="#ffffff" text-anchor="middle" font-weight="normal" font-style="normal" dominant-baseline="middle">1</text><line x1="246" y1="285" x2="290" y2="285" stroke="#1f4e79" stroke-width="4" stroke-linecap="round" marker-end="url(#arw)"/><rect x="296" y="210" width="210" height="150" rx="12" fill="#eef4fb" fill-opacity="1.0" stroke="#1f4e79" stroke-width="3"/><text x="401.0" y="259.0" font-size="25" fill="#10243a" text-anchor="middle" font-weight="normal" font-style="normal" dominant-baseline="middle">Deposition</text><text x="401.0" y="288.5" font-size="18" fill="#40546b" text-anchor="middle" font-weight="normal" font-style="normal" dominant-baseline="middle">Thin film grown</text><text x="401.0" y="314.5" font-size="18" fill="#40546b" text-anchor="middle" font-weight="normal" font-style="normal" dominant-baseline="middle">or deposited</text><circle cx="401.0" cy="158" r="26" fill="#1f4e79" stroke="#1f4e79" stroke-width="3"/><text x="401.0" y="158" font-size="24" fill="#ffffff" text-anchor="middle" font-weight="normal" font-style="normal" dominant-baseline="middle">2</text><line x1="512" y1="285" x2="556" y2="285" stroke="#1f4e79" stroke-width="4" stroke-linecap="round" marker-end="url(#arw)"/><rect x="562" y="210" width="210" height="150" rx="12" fill="#eef4fb" fill-opacity="1.0" stroke="#1f4e79" stroke-width="3"/><text x="667.0" y="259.0" font-size="25" fill="#10243a" text-anchor="middle" font-weight="normal" font-style="normal" dominant-baseline="middle">Lithography</text><text x="667.0" y="288.5" font-size="18" fill="#40546b" text-anchor="middle" font-weight="normal" font-style="normal" dominant-baseline="middle">Pattern written</text><text x="667.0" y="314.5" font-size="18" fill="#40546b" text-anchor="middle" font-weight="normal" font-style="normal" dominant-baseline="middle">into photoresist</text><circle cx="667.0" cy="158" r="26" fill="#1f4e79" stroke="#1f4e79" stroke-width="3"/><text x="667.0" y="158" font-size="24" fill="#ffffff" text-anchor="middle" font-weight="normal" font-style="normal" dominant-baseline="middle">3</text><line x1="778" y1="285" x2="822" y2="285" stroke="#1f4e79" stroke-width="4" stroke-linecap="round" marker-end="url(#arw)"/><rect x="828" y="210" width="210" height="150" rx="12" fill="#eef4fb" fill-opacity="1.0" stroke="#1f4e79" stroke-width="3"/><text x="933.0" y="259.0" font-size="25" fill="#10243a" text-anchor="middle" font-weight="normal" font-style="normal" dominant-baseline="middle">Etching</text><text x="933.0" y="288.5" font-size="18" fill="#40546b" text-anchor="middle" font-weight="normal" font-style="normal" dominant-baseline="middle">Pattern transferred</text><text x="933.0" y="314.5" font-size="18" fill="#40546b" text-anchor="middle" font-weight="normal" font-style="normal" dominant-baseline="middle">into the film</text><circle cx="933.0" cy="158" r="26" fill="#1f4e79" stroke="#1f4e79" stroke-width="3"/><text x="933.0" y="158" font-size="24" fill="#ffffff" text-anchor="middle" font-weight="normal" font-style="normal" dominant-baseline="middle">4</text><line x1="1044" y1="285" x2="1088" y2="285" stroke="#1f4e79" stroke-width="4" stroke-linecap="round" marker-end="url(#arw)"/><rect x="1094" y="210" width="210" height="150" rx="12" fill="#eef4fb" fill-opacity="1.0" stroke="#1f4e79" stroke-width="3"/><text x="1199.0" y="259.0" font-size="25" fill="#10243a" text-anchor="middle" font-weight="normal" font-style="normal" dominant-baseline="middle">Release</text><text x="1199.0" y="288.5" font-size="18" fill="#40546b" text-anchor="middle" font-weight="normal" font-style="normal" dominant-baseline="middle">Sacrificial layer</text><text x="1199.0" y="314.5" font-size="18" fill="#40546b" text-anchor="middle" font-weight="normal" font-style="normal" dominant-baseline="middle">removed</text><circle cx="1199.0" cy="158" r="26" fill="#1f4e79" stroke="#1f4e79" stroke-width="3"/><text x="1199.0" y="158" font-size="24" fill="#ffffff" text-anchor="middle" font-weight="normal" font-style="normal" dominant-baseline="middle">5</text><line x1="1310" y1="285" x2="1354" y2="285" stroke="#1f4e79" stroke-width="4" stroke-linecap="round" marker-end="url(#arw)"/><rect x="1360" y="210" width="210" height="150" rx="12" fill="#eef4fb" fill-opacity="1.0" stroke="#1f4e79" stroke-width="3"/><text x="1465.0" y="259.0" font-size="25" fill="#10243a" text-anchor="middle" font-weight="normal" font-style="normal" dominant-baseline="middle">Package &amp; test</text><text x="1465.0" y="288.5" font-size="18" fill="#40546b" text-anchor="middle" font-weight="normal" font-style="normal" dominant-baseline="middle">Diced, sealed,</text><text x="1465.0" y="314.5" font-size="18" fill="#40546b" text-anchor="middle" font-weight="normal" font-style="normal" dominant-baseline="middle">characterised</text><circle cx="1465.0" cy="158" r="26" fill="#1f4e79" stroke="#1f4e79" stroke-width="3"/><text x="1465.0" y="158" font-size="24" fill="#ffffff" text-anchor="middle" font-weight="normal" font-style="normal" dominant-baseline="middle">6</text><rect x="30" y="430" width="1540" height="110" rx="14" fill="#fdf5ec" fill-opacity="1.0" stroke="#c46a12" stroke-width="3"/><text x="800" y="466" font-size="23" fill="#10243a" text-anchor="middle" font-weight="normal" font-style="normal" dominant-baseline="middle">Steps 2-4 are repeated for every structural layer.</text><text x="800" y="506" font-size="23" fill="#10243a" text-anchor="middle" font-weight="normal" font-style="normal" dominant-baseline="middle">Step 5 frees the moving parts - this is what makes the device mechanical.</text></svg>