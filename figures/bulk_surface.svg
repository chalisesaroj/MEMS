<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 780" width="1600" height="780" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arw" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1f4e79"/></marker><marker id="arwW" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c46a12"/></marker><marker id="arwG" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5c6b7a"/></marker></defs><rect x="0" y="0" width="1600" height="780" fill="#ffffff"/><line x1="800" y1="30" x2="800" y2="750" stroke="#c8d3de" stroke-width="2" stroke-linecap="round" stroke-dasharray="10,10"/><text x="430" y="62" font-size="30" fill="#10243a" text-anchor="middle" font-weight="bold" font-style="normal" dominant-baseline="middle">Bulk micromachining</text><text x="430" y="104" font-size="20" fill="#40546b" text-anchor="middle" font-weight="normal" font-style="normal" dominant-baseline="middle">the wafer itself is the mechanical material</text><rect x="150" y="380" width="560" height="260" rx="0" fill="#c9d6e4" fill-opacity="1.0" stroke="#34495e" stroke-width="3"/><polyline points="290,640 290,420 570,420 570,640" fill="none" stroke="#34495e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="9,7"/><rect x="290" y="380" width="280" height="40" rx="0" fill="#e8a33d" fill-opacity="1.0" stroke="#8a5410" stroke-width="3"/><text x="430" y="165" font-size="19" fill="#40546b" text-anchor="middle" font-weight="normal" font-style="normal" dominant-baseline="middle">(a few micrometres thick)</text><text x="430" y="195" font-size="22" fill="#10243a" text-anchor="middle" font-weight="normal" font-style="normal" dominant-baseline="middle">Thin silicon diaphragm</text><line x1="430" y1="215" x2="430" y2="375" stroke="#1f4e79" stroke-width="2" stroke-linecap="round" stroke-dasharray="6,6"/><line x1="430" y1="682" x2="430" y2="615" stroke="#1f4e79" stroke-width="2" stroke-linecap="round" stroke-dasharray="6,6" marker-end="url(#arw)"/><text x="430" y="706" font-size="21" fill="#10243a" text-anchor="middle" font-weight="normal" font-style="normal" dominant-baseline="middle">Cavity etched from the back of the wafer</text><text x="105" y="496.25" font-size="22" fill="#10243a" text-anchor="end" font-weight="normal" font-style="normal" dominant-baseline="middle">Silicon</text><text x="105" y="523.75" font-size="22" fill="#10243a" text-anchor="end" font-weight="normal" font-style="normal" dominant-baseline="middle">wafer</text><text x="1190" y="62" font-size="30" fill="#10243a" text-anchor="middle" font-weight="bold" font-style="normal" dominant-baseline="middle">Surface micromachining</text><text x="1190" y="104" font-size="20" fill="#40546b" text-anchor="middle" font-weight="normal" font-style="normal" dominant-baseline="middle">thin films are built up, then partly removed</text><rect x="900" y="560" width="580" height="90" rx="0" fill="#c9d6e4" fill-opacity="1.0" stroke="#34495e" stroke-width="3"/><rect x="980" y="490" width="70" height="70" rx="0" fill="#e8a33d" fill-opacity="1.0" stroke="#8a5410" stroke-width="3"/><rect x="980" y="490" width="400" height="24" rx="0" fill="#e8a33d" fill-opacity="1.0" stroke="#8a5410" stroke-width="3"/><rect x="1050" y="514" width="330" height="46" rx="0" fill="#ffffff" fill-opacity="1.0" stroke="#8a5410" stroke-width="2" stroke-dasharray="8,6"/><text x="1090" y="452" font-size="21" fill="#10243a" text-anchor="middle" font-weight="normal" font-style="normal" dominant-baseline="middle">Structural layer (polysilicon)</text><text x="1360" y="448" font-size="19" fill="#c46a12" text-anchor="middle" font-weight="normal" font-style="normal" dominant-baseline="middle">free to move</text><line x1="1360" y1="470" x2="1360" y2="486" stroke="#c46a12" stroke-width="3" stroke-linecap="round" marker-end="url(#arwW)"/><text x="1215" y="537" font-size="17" fill="#8a5410" text-anchor="middle" font-weight="normal" font-style="normal" dominant-baseline="middle">removed sacrificial layer</text><text x="1190" y="690" font-size="22" fill="#10243a" text-anchor="middle" font-weight="normal" font-style="normal" dominant-baseline="middle">Silicon substrate</text></svg>