<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 640" width="1600" height="640" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arw" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1f4e79"/></marker><marker id="arwW" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c46a12"/></marker><marker id="arwG" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5c6b7a"/></marker></defs><rect x="0" y="0" width="1600" height="640" fill="#ffffff"/><rect x="80" y="100" width="330" height="110" rx="12" fill="#dbe8f6" fill-opacity="1.0" stroke="#1f4e79" stroke-width="3"/><text x="245.0" y="142.0" font-size="23" fill="#10243a" text-anchor="middle" font-weight="normal" font-style="normal" dominant-baseline="middle">Accelerometer</text><text x="245.0" y="170.5" font-size="18" fill="#40546b" text-anchor="middle" font-weight="normal" font-style="normal" dominant-baseline="middle">fast, but drifts</text><line x1="415" y1="155" x2="695" y2="275" stroke="#1f4e79" stroke-width="3" stroke-linecap="round" marker-end="url(#arw)"/><rect x="80" y="260" width="330" height="110" rx="12" fill="#dbe8f6" fill-opacity="1.0" stroke="#1f4e79" stroke-width="3"/><text x="245.0" y="302.0" font-size="23" fill="#10243a" text-anchor="middle" font-weight="normal" font-style="normal" dominant-baseline="middle">Gyroscope</text><text x="245.0" y="330.5" font-size="18" fill="#40546b" text-anchor="middle" font-weight="normal" font-style="normal" dominant-baseline="middle">good short-term rate</text><line x1="415" y1="315" x2="695" y2="320" stroke="#1f4e79" stroke-width="3" stroke-linecap="round" marker-end="url(#arw)"/><rect x="80" y="420" width="330" height="110" rx="12" fill="#dbe8f6" fill-opacity="1.0" stroke="#1f4e79" stroke-width="3"/><text x="245.0" y="462.0" font-size="23" fill="#10243a" text-anchor="middle" font-weight="normal" font-style="normal" dominant-baseline="middle">Magnetometer</text><text x="245.0" y="490.5" font-size="18" fill="#40546b" text-anchor="middle" font-weight="normal" font-style="normal" dominant-baseline="middle">absolute heading, noisy</text><line x1="415" y1="475" x2="695" y2="365" stroke="#1f4e79" stroke-width="3" stroke-linecap="round" marker-end="url(#arw)"/><rect x="700" y="230" width="420" height="180" rx="12" fill="#dbe8f6" fill-opacity="1.0" stroke="#1f4e79" stroke-width="3"/><text x="910.0" y="293.5" font-size="26" fill="#10243a" text-anchor="middle" font-weight="normal" font-style="normal" dominant-baseline="middle">Sensor fusion</text><text x="910.0" y="324.0" font-size="19" fill="#40546b" text-anchor="middle" font-weight="normal" font-style="normal" dominant-baseline="middle">Kalman filter / complementary filter</text><text x="910.0" y="350.5" font-size="18" fill="#40546b" text-anchor="middle" font-weight="normal" font-style="normal" dominant-baseline="middle">weighted combination of inputs</text><line x1="1125" y1="320" x2="1255" y2="320" stroke="#1f4e79" stroke-width="4" stroke-linecap="round" marker-end="url(#arw)"/><rect x="1260" y="250" width="300" height="140" rx="12" fill="#fdf5ec" fill-opacity="1.0" stroke="#1f4e79" stroke-width="3"/><text x="1410.0" y="307.0" font-size="22" fill="#10243a" text-anchor="middle" font-weight="normal" font-style="normal" dominant-baseline="middle">Robust estimate</text><text x="1410.0" y="335.0" font-size="18" fill="#40546b" text-anchor="middle" font-weight="normal" font-style="normal" dominant-baseline="middle">attitude, position, motion</text><text x="800" y="585" font-size="21" fill="#40546b" text-anchor="middle" font-weight="normal" font-style="normal" dominant-baseline="middle">Cross-checking several sensors reduces noise and allows faults to be detected.</text></svg>