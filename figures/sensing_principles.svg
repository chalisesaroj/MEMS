 x="290" y="316" font-size="22" fill="#8a5410" text-anchor="middle" font-weight="normal" font-style="normal" dominant-baseline="middle">- - - - -</text><line x1="480" y1="340" x2="480" y2="248" stroke="#c46a12" stroke-width="3" stroke-linecap="round" marker-end="url(#arwW)" marker-start="url(#arwW)"/><text x="508" y="294" font-size="24" fill="#10243a" text-anchor="middle" font-weight="normal" font-style="normal" dominant-baseline="middle">d</text><text x="290" y="460" font-size="24" fill="#10243a" text-anchor="middle" font-weight="normal" font-style="normal" dominant-baseline="middle">C = ε0 εr A / d</text><text x="290" y="520" font-size="20" fill="#40546b" text-anchor="middle" font-weight="normal" font-style="normal" dominant-baseline="middle">Displacement changes the gap d,</text><text x="290" y="550" font-size="20" fill="#40546b" text-anchor="middle" font-weight="normal" font-style="normal" dominant-baseline="middle">so the capacitance changes.</text><rect x="650" y="322" width="20" height="60" rx="0" fill="#8a99a8" fill-opacity="1.0" stroke="#5c6b7a" stroke-width="2"/><rect x="930" y="322" width="20" height="60" rx="0" fill="#8a99a8" fill-opacity="1.0" stroke="#5c6b7a" stroke-width="2"/><rect x="650" y="300" width="300" height="22" rx="0" fill="#b9c8d8" fill-opacity="1.0" stroke="#5c6b7a" stroke-width="2"/><line x1="800" y1="200" x2="800" y2="292" stroke="#c46a12" stroke-width="4" stroke-linecap="round" marker-end="url(#arwW)"/><text x="830" y="232" font-size="24" fill="#c46a12" text-anchor="middle" font-weight="normal" font-style="normal" dominant-baseline="middle">F</text><path d="M 650 322 Q 800 400 950 322" fill="none" stroke="#c46a12" stroke-width="3" stroke-linecap="round" stroke-dasharray="8,6"/><text x="800" y="460" font-size="24" fill="#10243a" text-anchor="middle" font-weight="normal" font-style="normal" dominant-baseline="middle">ΔR / R = G ε</text><text x="800" y="520" font-size="20" fill="#40546b" text-anchor="middle" font-weight="normal" font-style="normal" dominant-baseline="middle">Bending strains the beam;</text><text x="800" y="550" font-size="20" fill="#40546b" text-anchor="middle" font-weight="normal" font-style="normal" dominant-baseline="middle">strain changes its resistance.</text><rect x="1230" y="270" width="160" height="110" rx="0" fill="#cfe3d4" fill-opacity="1.0" stroke="#1e7a4d" stroke-width="3"/><rect x="1230" y="252" width="160" height="18" rx="0" fill="#aab4be" fill-opacity="1.0" stroke="#5c6b7a" stroke-width="2"/><rect x="1230" y="380" width="160" height="18" rx="0" fill="#aab4be" fill-opacity="1.0" stroke="#5c6b7a" stroke-width="2"/><line x1="1310" y1="180" x2="1310" y2="244" stroke="#c46a12" stroke-width="4" stroke-linecap="round" marker-end="url(#arwW)"/><line x1="1310" y1="452" x2="1310" y2="406" stroke="#c46a12" stroke-width="4" stroke-linecap="round" marker-end="url(#arwW)"/><text x="1345" y="205" font-size="22" fill="#c46a12" text-anchor="middle" font-weight="normal" font-style="normal" dominant-baseline="middle">F</text><text x="1345" y="432" font-size="22" fill="#c46a12" text-anchor="middle" font-weight="normal" font-style="normal" dominant-baseline="middle">F</text><text x="1195" y="261" font-size="22" fill="#c0392b" text-anchor="end" font-weight="normal" font-style="normal" dominant-baseline="middle">+ + +</text><text x="1195" y="389" font-size="22" fill="#2471a3" text-anchor="end" font-weight="normal" font-style="normal" dominant-baseline="middle">- - -</text><polyline points="1390,261 1455,261 1455,300" fill="none" stroke="#1f4e79" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><polyline points="1390,389 1455,389 1455,350" fill="none" stroke="#1f4e79" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><rect x="1420" y="300" width="70" height="50" rx="8" fill="#ffffff" fill-opacity="1.0" stroke="#1f4e79" stroke-width="3"/><text x="1455" y="325" font-size="24" fill="#1f4e79" text-anchor="middle" font-weight="normal" font-style="normal" dominant-baseline="middle">V</text><text x="1310" y="520" font-size="24" fill="#10243a" text-anchor="middle" font-weight="normal" font-style="normal" dominant-baseline="middle">V ∝ applied stress</text><text x="1310" y="580" font-size="20" fill="#40546b" text-anchor="middle" font-weight="normal" font-style="normal" dominant-baseline="middle">Deformation displaces charge,</text><text x="1310" y="610" font-size="20" fill="#40546b" text-anchor="middle" font-weight="normal" font-style="normal" dominant-baseline="middle">producing a voltage.</text></svg>